name: Full Stack CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r server/requirements.txt flake8
      - run: flake8 server/djangoapp server/djangoproj --select=E9,F63,F7,F82 --show-source
      - run: python server/manage.py test djangoapp
      - run: node --check server/database/app.js
      - run: npm ci && npm run build
        working-directory: server/frontend
